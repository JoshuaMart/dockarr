# ============================================================================
# Dockarr — *arr media stack
# Pinned image versions are the source of truth. Update them via Renovate PRs
# (see renovate.json) then deploy with `make update`.
#
# Published ports are bound to ${DOCKARR_BIND} (default 127.0.0.1), so only
# Caddy (:80/:443) faces the network and every service is reached over HTTPS at
# <service>.${DOCKARR_DOMAIN}. Set DOCKARR_BIND=0.0.0.0 in .env to also expose
# the raw ports on the LAN. Peer/discovery ports (qBittorrent 6881, Jellyfin
# 7359 & 1900) stay on all interfaces: they are useless bound to loopback.
# ============================================================================

x-common: &common
  restart: unless-stopped
  environment: &common-env
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-Etc/UTC}
  networks:
    - dockarr

services:
  # --- Reverse proxy --------------------------------------------------------
  caddy:
    <<: *common
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOCKARR_DOMAIN: ${DOCKARR_DOMAIN:-dockarr.local}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config

  # --- Landing dashboard ----------------------------------------------------
  # Static PHP page listing every service with a live up/down status (probed
  # server-side). COMPOSE_PROFILES / COMPOSE_FILE / DOCKARR_LANG are passed in so
  # it can tell which optional services are on and in which language to render.
  dashboard:
    <<: *common
    image: php:8.5-apache@sha256:f988b6749b43c04ed0ae73b5b53920d5afdb4b92707c730f1eae2c5d065e694d
    container_name: dashboard
    environment:
      <<: *common-env
      DOCKARR_DOMAIN: ${DOCKARR_DOMAIN:-dockarr.local}
      DOCKARR_LANG: ${DOCKARR_LANG:-en}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      COMPOSE_FILE: ${COMPOSE_FILE:-}
    volumes:
      - ./dashboard:/var/www/html:ro
    ports:
      - "${DOCKARR_BIND:-127.0.0.1}:8081:80"

  # --- Download client ------------------------------------------------------
  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:5.2.3@sha256:457e4eec2ee3f5e4ef59f237ad51f6143deba9f7445ab48bb5204a98888ef9aa
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT:-8080}
    volumes:
      - ${DOCKARR_CONFIG}/qbittorrent:/config
      - ${DOCKARR_DATA}:/data
      # Hardlinks finished book downloads into the Kavita library (run on
      # torrent completion; wired by the qbittorrent-setup bootstrap module).
      - ./qbittorrent/on-complete.sh:/scripts/on-complete.sh:ro
    ports:
      - "${DOCKARR_BIND:-127.0.0.1}:${QBITTORRENT_WEBUI_PORT:-8080}:${QBITTORRENT_WEBUI_PORT:-8080}"
      - "6881:6881"
      - "6881:6881/udp"

  # Modern web UI for qBittorrent (autobrr/qui)
  qui:
    <<: *common
    image: ghcr.io/autobrr/qui:latest@sha256:263c131adb007be98469959d5d3625e88476417c900519a1abad0bd609f0f103
    container_name: qui
    volumes:
      - ${DOCKARR_CONFIG}/qui:/config
    ports:
      - "${DOCKARR_BIND:-127.0.0.1}:7476:7476"

  # --- Indexers -------------------------------------------------------------
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:2.6.5@sha256:c96b56d94d116a9f4de94bc23d3381689492e6c3cfb7435320e8d982e406f99a
    container_name: prowlarr
    volumes:
      - ${DOCKARR_CONFIG}/prowlarr:/config
    ports:
      - "${DOCKARR_BIND:-127.0.0.1}:9696:9696"

  # --- Movies ---------------------------------------------------------------
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:6.4.4@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
    container_name: radarr
    volumes:
      - ${DOCKARR_CONFIG}/radarr:/config
      - ${DOCKARR_DATA}:/data
    ports:
      - "${DOCKARR_BIND:-127.0.0.1}:7878:7878"

  # --- TV shows -------------------------------------------------------------
  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.20@sha256:a5c1a5fecbef946927ab90ad68df319ac5fe644057e5fc18cd993f01ac07b2b2
    container_name: sonarr
    volumes:
      - ${DOCKARR_CONFIG}/sonarr:/config
      - ${DOCKARR_DATA}:/data
    ports:
      - "${DOCKARR_BIND:-127.0.0.1}:8989:8989"

  # --- Quality profiles / custom formats sync -------------------------------
  profilarr:
    <<: *common
    image: ghcr.io/dictionarry-hub/profilarr:latest@sha256:ddcdd0f340043c2ec0a85ca74b9a6be9be42b1c0288c75fc36a26a43f695860b
    container_name: profilarr
    environment:
      <<: *common-env
      # SvelteKit form actions reject cross-origin POSTs unless ORIGIN matches
      # the external URL served by Caddy (scheme + host + port).
      ORIGIN: https://profilarr.${DOCKARR_DOMAIN:-dockarr.local}
    volumes:
      - ${DOCKARR_CONFIG}/profilarr:/config
    ports:
      - "${DOCKARR_BIND:-127.0.0.1}:6868:6868"

  # --- Requests -------------------------------------------------------------
  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:latest@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    container_name: seerr
    volumes:
      - ${DOCKARR_CONFIG}/seerr:/app/config
    ports:
      - "${DOCKARR_BIND:-127.0.0.1}:5055:5055"

  # --- Media server (video) -------------------------------------------------
  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:10.11.11@sha256:438e44330078e6b1a810fdec9dc0f4773e6595edb137c5eb4417a516da4c7f0e
    container_name: jellyfin
    volumes:
      - ${DOCKARR_CONFIG}/jellyfin:/config
      - ${DOCKARR_DATA}/media:/media:ro
    ports:
      - "${DOCKARR_BIND:-127.0.0.1}:8096:8096"
      - "7359:7359/udp" # client auto-discovery
      - "1900:1900/udp" # DLNA

  # --- Media server (books / comics / manga) --------------------------------
  kavita:
    <<: *common
    image: lscr.io/linuxserver/kavita:0.9.1@sha256:cf2a67b0eec795c8f94cfa27c2fba4c347d25deba5f15acffa24cb5a1115ffa8
    container_name: kavita
    # Optional service: only started when "kavita" is in COMPOSE_PROFILES (.env).
    # The bootstrap toggles that flag from the first-run prompt, so `make up` and
    # `make update` honour the choice without restarting a disabled Kavita.
    profiles: ["kavita"]
    volumes:
      - ${DOCKARR_CONFIG}/kavita:/config
      - ${DOCKARR_DATA}/media/books:/books
    ports:
      - "${DOCKARR_BIND:-127.0.0.1}:${KAVITA_PORT:-5000}:5000"

  # OPTIONAL — route qBittorrent through a VPN (Gluetun) by enabling it at
  # `make install` (or `make bootstrap m=vpn`). The bootstrap then sets
  # COMPOSE_FILE=docker-compose.yml:docker-compose.vpn.yml in .env, which layers
  # the gluetun service and rewires qBittorrent. See docker-compose.vpn.yml and
  # docs/vpn.

networks:
  dockarr:
    name: dockarr
